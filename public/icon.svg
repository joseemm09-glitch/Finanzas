<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Background Squircle / Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Accent -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#3B82F6" stroke-width="4" stroke-opacity="0.3" />

  <!-- Structural Balance Node & Geometry -->
  <g transform="translate(64, 64)">
    <!-- Base Foundation Line -->
    <line x1="44" y1="316" x2="340" y2="316" stroke="#60A5FA" stroke-width="14" stroke-linecap="round" />

    <!-- Bar 1 (Left - Operational Base) -->
    <rect x="74" y="210" width="44" height="106" rx="10" fill="#FFFFFF" fill-opacity="0.8" />

    <!-- Bar 2 (Center - Growth Pillar) -->
    <rect x="170" y="130" width="44" height="186" rx="10" fill="#FFFFFF" />

    <!-- Bar 3 (Right - High Yield Pillar) -->
    <rect x="266" y="68" width="44" height="248" rx="10" fill="url(#blueGrad)" />

    <!-- Dynamic Balance Beam / Trend Line -->
    <polyline points="96,190 192,112 288,52" fill="none" stroke="#60A5FA" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Dynamic Node Points -->
    <circle cx="96" cy="190" r="14" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="6" />
    <circle cx="192" cy="112" r="14" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="6" />
    <circle cx="288" cy="52" r="16" fill="#60A5FA" stroke="#FFFFFF" stroke-width="6" />
  </g>
</svg>
